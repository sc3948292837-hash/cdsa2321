name: Build Android APK in GitHub

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "Root files:"
          ls -la
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Android project structure
        run: |
          test -f settings.gradle.kts || (echo "ERROR: settings.gradle.kts not found in repository root" && exit 1)
          test -f build.gradle.kts || (echo "ERROR: build.gradle.kts not found in repository root" && exit 1)
          test -f app/build.gradle.kts || (echo "ERROR: app/build.gradle.kts not found" && exit 1)
          test -f gradlew || (echo "ERROR: gradlew not found in repository root" && exit 1)

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Check Gradle version
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DyadyaVitya-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
